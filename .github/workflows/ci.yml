name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # A formatting or lint verdict does not depend on the version of node. In
      # the matrix the same complaint would be reported twice, labelled with a
      # version that has nothing to do with it. No `needs` either: a formatting
      # nit must never hide a failing test, so both jobs start at once.
      - run: npm run check

      # The corpus the unit tests read is written into the repository, so a
      # generator edited without regenerating leaves the suite reading a corpus
      # nobody meant. Regenerating here and asking for no difference is what
      # says so, rather than letting a stale corpus pass unnoticed.
      - name: The committed corpus is the one the generator writes
        run: |
          npm run build:fixtures
          git diff --exit-code test/fixtures

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Unit tests only. The live suite and the evals read pages a volunteer
      # association pays for, and they are opt-in for that reason.
      - run: npm test
      - run: npm run build
